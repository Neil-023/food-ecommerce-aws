name: Deploy Food E-Commerce Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-food-ecommerce
  cancel-in-progress: true

jobs:
  deploy-lambda:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies and Package
        run: |
          cd backend
          pip install -r requirements.txt -t ./package
          cp -r ./*.py ./package/
          cd package
          zip -r ../deployment.zip .
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name food-ecommerce-backend \
            --zip-file fileb://backend/deployment.zip

  deploy-docker-ec2:
    name: Deploy Full Stack to EC2 via Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 161.118.239.128
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,backend,nginx.prod.conf"
          target: "/home/ubuntu/food-ecommerce"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 161.118.239.128
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/food-ecommerce

            compose() {
              if docker compose version >/dev/null 2>&1; then
                LEGACY_COMPOSE=0
                docker compose "$@"
              elif command -v docker-compose >/dev/null 2>&1; then
                LEGACY_COMPOSE=1
                docker-compose "$@"
              else
                echo "No Docker Compose command found on server" >&2
                exit 1
              fi
            }

            cat > .env <<'EOF'
            ${{ secrets.FOOD_ECOM_DOTENV }}
            EOF

            if [ "${LEGACY_COMPOSE:-1}" -eq 1 ]; then
              for name in food_ecommerce_backend_prod food_ecommerce_db_prod food_ecommerce_nginx_prod; do
                ids="$(docker ps -aq --filter "name=${name}" || true)"
                if [ -n "${ids}" ]; then
                  docker rm -f ${ids} >/dev/null 2>&1 || true
                fi
              done
              compose -f docker-compose.prod.yml down --remove-orphans || true
              compose -f docker-compose.prod.yml up -d --build
            else
              compose -f docker-compose.prod.yml up -d --build --remove-orphans
            fi

            docker image prune -f 