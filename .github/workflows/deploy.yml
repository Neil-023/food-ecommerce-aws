name: Deploy Food E-Commerce

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:


concurrency:
  group: deploy-food-ecommerce
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend dist in CI
      working-directory: frontend
      run: |
        npm ci
        npm run build
        rm -rf node_modules

    - name: Copy project via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 161.118.239.128
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.prod.yml,backend,frontend,nginx.prod.conf"
        target: "/home/ubuntu/food-ecommerce"

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: 161.118.239.128
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          cd /home/ubuntu/food-ecommerce

          compose() {
            if docker compose version >/dev/null 2>&1; then
              LEGACY_COMPOSE=0
              docker compose "$@"
            elif command -v docker-compose >/dev/null 2>&1; then
              LEGACY_COMPOSE=1
              docker-compose "$@"
            else
              echo "No Docker Compose command found on server" >&2
              exit 1
            fi
          }

          cat > .env <<'EOF'
          ${{ secrets.FOOD_ECOM_DOTENV }}
          EOF

          docker build -f frontend/Dockerfile.prod -t food-ecommerce-frontend:prod frontend

          if [ "${LEGACY_COMPOSE:-1}" -eq 1 ]; then
            docker rm -f food_ecommerce_frontend_prod food_ecommerce_backend_prod food_ecommerce_db_prod food_ecommerce_nginx_prod >/dev/null 2>&1 || true
            compose -f docker-compose.prod.yml up -d --build
          else
            compose -f docker-compose.prod.yml up -d --build --remove-orphans
          fi

          docker image prune -f
