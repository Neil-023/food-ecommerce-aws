server {
    listen 80;
    server_name _; # This acts as a catch-all for your IP address

    # 1. Route API traffic to the FastAPI Backend
    location /api/ {
        # Note: Docker's internal DNS automatically resolves 'backend' to the container IP
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Route all other traffic to the React Frontend
    location / {
        proxy_pass http://frontend:5173; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}