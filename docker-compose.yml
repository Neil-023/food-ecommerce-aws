version: '3.8'

services:
  # 1. THE DATABASE
  db:
    image: postgres:15-alpine
    container_name: food_ecommerce_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. THE API BACKEND
  backend:
    build: ./backend
    container_name: food_ecommerce_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_MINUTES=${ACCESS_TOKEN_MINUTES}
      - REFRESH_TOKEN_DAYS=${REFRESH_TOKEN_DAYS}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}

  # 3. THE REACT FRONTEND
  # 3. THE REACT FRONTEND
  frontend:
    build: ./frontend
    container_name: food_ecommerce_frontend
    restart: always
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
      - VITE_USE_MOCK_FALLBACK=${VITE_USE_MOCK_FALLBACK}
      - CHOKIDAR_USEPOLLING=true # Helps Docker detect file changes
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # --- ADD THESE LINES ---
    volumes:
      - ./frontend:/app # Map your local code to the container
      - /app/node_modules # Anonymous volume to protect container's node_modules

volumes:
  pgdata:
