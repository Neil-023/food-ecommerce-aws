version: '3.8'

services:
  # 1. THE DATABASE
  db:
    image: postgres:15-alpine
    container_name: food_ecommerce_db
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M # Slightly lower to accommodate the second DB
        reservations:
          memory: 100M
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. THE API BACKEND
  backend:
    build: ./backend
    container_name: food_ecommerce_backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_MINUTES=${ACCESS_TOKEN_MINUTES}
      - REFRESH_TOKEN_DAYS=${REFRESH_TOKEN_DAYS}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}

  # 3. THE REACT FRONTEND
  frontend:
    build: ./frontend
    container_name: food_ecommerce_frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET}
      - VITE_USE_MOCK_FALLBACK=${VITE_USE_MOCK_FALLBACK}
      - CHOKIDAR_USEPOLLING=true 
    depends_on:
      - backend

  # 4. THE INTERNAL PROXY
  nginx:
    image: nginx:alpine
    container_name: food_ecommerce_nginx
    restart: always
    ports:
      # Map to 3001 so the Ubuntu Nginx can find it without conflicting with Port 80
      - "127.0.0.1:3001:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata: